name: "Build macOS Universal (Apple Silicon M1-M4 and Intel)"

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-macos:
    name: "Build macOS VST3 and AU"
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build-mac \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DBUILD_PLUGIN=ON

      - name: Build Plugins
        run: |
          cmake --build build-mac --config Release --parallel

      - name: Ad-Hoc Sign Binaries
        run: |
          find build-mac/NordPianoPrototype_artefacts/Release -name "*.vst3" -exec codesign --force --deep --sign - {} + || true
          find build-mac/NordPianoPrototype_artefacts/Release -name "*.component" -exec codesign --force --deep --sign - {} + || true
          find build-mac/NordPianoPrototype_artefacts/Release -name "*.app" -exec codesign --force --deep --sign - {} + || true

      - name: Prepare Package
        run: |
          mkdir -p package_mac
          if [ -d "build-mac/NordPianoPrototype_artefacts/Release/VST3/Nord Pianos.vst3" ]; then
            cp -R "build-mac/NordPianoPrototype_artefacts/Release/VST3/Nord Pianos.vst3" package_mac/
          fi
          if [ -d "build-mac/NordPianoPrototype_artefacts/Release/AU/Nord Pianos.component" ]; then
            cp -R "build-mac/NordPianoPrototype_artefacts/Release/AU/Nord Pianos.component" package_mac/
          fi
          if [ -d "build-mac/NordPianoPrototype_artefacts/Release/Standalone/Nord Pianos.app" ]; then
            cp -R "build-mac/NordPianoPrototype_artefacts/Release/Standalone/Nord Pianos.app" package_mac/
          fi
          
          # Add simple install guide
          cat << 'EOF' > package_mac/COMO_INSTALAR_NO_MAC.txt
================================================================
           NORD PIANOS - INSTALACAO NO MACOS (M1/M2/M3)
================================================================

1. FORMATO VST3 (Ableton Live, Reaper, Cubase, Studio One):
   Copie a pasta "Nord Pianos.vst3" para:
   /Library/Audio/Plug-Ins/VST3/
   (ou ~/Library/Audio/Plug-Ins/VST3/)

2. FORMATO AU - Audio Unit (Logic Pro, MainStage, GarageBand):
   Copie a pasta "Nord Pianos.component" para:
   /Library/Audio/Plug-Ins/Components/
   (ou ~/Library/Audio/Plug-Ins/Components/)

3. APLICATIVO STANDALONE:
   Arraste "Nord Pianos.app" para a sua pasta Aplicativos.

PASTA DE SONS (.npno / .nsmp):
Coloque seus arquivos de timbres em:
~/Music/Nord Pianos/Sounds/

SE O MAC BLOQUEAR O PLUGIN NA PRIMEIRA VEZ:
Abra o Terminal no Mac e rode:
sudo xattr -cr "/Library/Audio/Plug-Ins/VST3/Nord Pianos.vst3"
sudo xattr -cr "/Library/Audio/Plug-Ins/Components/Nord Pianos.component"
================================================================
EOF

          cd package_mac && zip -r ../Nord_Pianos_Mac_Apple_Silicon.zip * && cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nord_Pianos_Mac_Apple_Silicon
          path: Nord_Pianos_Mac_Apple_Silicon.zip
          retention-days: 30
